name: Test, build and deploy from main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - argocd/**
      - k8s/kustomization.yaml
      - .gitignore
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatbot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: azure/setup-kubectl@v4
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > /tmp/chatbot-rendered.yaml
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update main with the published image digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Retry a non-force push if main advances while this job publishes.
          for attempt in 1 2 3; do
            git fetch origin main
            # Never publish an older build over newer application/manifests changes.
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- . ':!docs' ':!argocd' ':!k8s/kustomization.yaml' ':!.gitignore'; then
              echo "Newer source changes exist on main; their workflow will deploy them."
              exit 0
            fi
            git switch -C main origin/main
            python - <<'PYTHON'
          import os, re
          from pathlib import Path
          p = Path('k8s/kustomization.yaml')
          content = p.read_text()
          # This deployment has exactly one image override.
          content, names = re.subn(r'^    newName:.*$', '    newName: ' + os.environ['IMAGE'], content, flags=re.M)
          content, versions = re.subn(r'^    (?:newTag|digest):.*$', '    digest: ' + os.environ['DIGEST'], content, flags=re.M)
          if names != 1 or versions != 1:
              raise SystemExit('Expected exactly one Kustomize image override')
          p.write_text(content)
          PYTHON
            git add k8s/kustomization.yaml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(deploy): pin image for ${GITHUB_SHA} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Could not update main; check branch rules and workflow write permission.' >&2
          exit 1
